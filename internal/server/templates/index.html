<!doctype html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuingo</title>
  <script src="{{.HTMX}}"></script>
  <script src="{{.Tailwind}}"></script>
</head>
<body class="h-full">
  <main class="mx-auto max-w-lg px-4 py-12">
    <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Fuingo</h1>
    <p class="mt-2 text-sm text-gray-600">
      Fuingo exchanges files for play-by-email games: players send their
      orders and collect their reports here.
    </p>
    <p id="status" class="mt-6 rounded-md bg-yellow-50 p-4 text-sm text-yellow-800" role="status">
      Signing in is not available yet, so this server accepts no files.
      Your game master will tell you when it opens.
    </p>
  </main>
</body>
</html>
