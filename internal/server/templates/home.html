<!doctype html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuingo</title>
  <script src="{{.HTMX}}"></script>
  <script src="{{.Tailwind}}"></script>
</head>
<body class="h-full">
  <header class="border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
      <span class="text-lg font-semibold tracking-tight text-gray-900">Fuingo</span>
      <div class="flex items-center gap-4">
        <span id="account" class="text-sm text-gray-600">{{.Email}}</span>
        <form method="post" action="{{.SignOutPath}}">
          <button type="submit" class="rounded-md bg-white px-3 py-1.5 text-sm font-semibold text-gray-900 ring-1 ring-gray-300 ring-inset hover:bg-gray-50">Sign out</button>
        </form>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-3xl px-4 py-12">
    <p id="status" class="rounded-md bg-yellow-50 p-4 text-sm text-yellow-800" role="status">
      You are signed in. Your games' files are not available on this site
      yet; your game master will tell you when they are.
    </p>
  </main>
</body>
</html>
